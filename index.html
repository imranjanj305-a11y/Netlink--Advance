<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetLink Advance - Remote Desktop</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 { color: #38bdf8; text-align: center; }
        .box {
            margin: 15px 0;
            padding: 15px;
            background: #0f172a;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        input, button {
            padding: 10px;
            margin: 5px 0;
            border-radius: 6px;
            border: none;
            font-size: 16px;
        }
        input {
            width: calc(100% - 22px);
            background: #1e293b;
            color: white;
            border: 1px solid #475569;
        }
        button {
            background: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: #0ea5e9; }
        video {
            width: 100%;
            max-height: 400px;
            background: black;
            border-radius: 8px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🌐 NetLink Advance</h1>
        <p style="text-align: center; color: #94a3b8;">Next-Gen Remote Desktop & Screen Sharing</p>

        <div class="box">
            <h3>1. Aapki Connection ID</h3>
            <p id="my-id" style="font-size: 18px; color: #34d399; font-weight: bold;">Generating ID...</p>
        </div>

        <div class="box">
            <h3>2. Doosre Device se Connect Karein</h3>
            <input type="text" id="remote-id-input" placeholder="Yahan remote device ki ID dalein">
            <button onclick="connectToPeer()">Connect & Share Screen</button>
        </div>

        <div class="box">
            <h3>3. Live Stream View</h3>
            <video id="remote-video" autoplay playsinline></video>
        </div>
    </div>

    <script>
        // Yahan ham WebRTC connection ka logic likhenge (Next step mein)
        console.log("NetLink Advance UI Loaded Successfully!");
    </script>

</body>
</html>
